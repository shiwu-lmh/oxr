<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OXR 文档解析工作台</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#182230;background:#f4f6f8;--ink:#182230;--muted:#718096;--line:#e2e8f0;--gold:#d7952c;--green:#18836a}
*{box-sizing:border-box}body{margin:0;min-height:100vh}.top{height:68px;background:#11151b;color:#f8fafc;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1240px)/2))}.brand{display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:.3px}.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#ffc55c,#c77b16);display:grid;place-items:center;color:#17120a;font-weight:900}.top-tag{font-size:12px;color:#aeb7c4;border:1px solid #39414d;border-radius:99px;padding:7px 12px}main{max-width:1240px;padding:34px 22px 60px;margin:auto}.intro{margin-bottom:24px}.intro h1{font-size:27px;margin:0 0 7px;letter-spacing:-.4px}.intro p{margin:0;color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:minmax(310px,390px) minmax(0,1fr);gap:20px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px #1925380a}.left{padding:20px}.card-title{font-size:15px;font-weight:700;margin:0 0 15px}.drop{min-height:204px;border:1.5px dashed #c6d0dc;background:#fafbfd;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;cursor:pointer;transition:.16s}.drop:hover,.drop.drag{border-color:var(--gold);background:#fffaf0}.upload-icon{width:42px;height:42px;border-radius:13px;background:#fff2d6;color:#9b6314;display:grid;place-items:center;font-size:21px;margin-bottom:12px}.drop strong{font-size:14px}.drop span{font-size:12px;color:var(--muted);margin-top:6px}.file-info{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:flex;align-items:center;gap:10px}.file-icon{width:34px;height:34px;flex:none;border-radius:9px;background:#eef3f8;color:#405b78;display:grid;place-items:center;font-size:12px;font-weight:800}.file-text{min-width:0;flex:1}.file-name{font-size:12px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-size{font-size:11px;color:var(--muted);margin-top:3px}.remove{border:0;background:transparent;color:#8893a1;cursor:pointer;font-size:18px}.actions{display:flex;gap:9px;margin-top:14px}.btn{border:0;border-radius:9px;padding:10px 13px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}.btn:disabled{opacity:.45;cursor:not-allowed}.primary{flex:1;background:#d8952e;color:#1d160b}.primary:hover:not(:disabled){background:#e5a23c}.plain{background:#eef1f5;color:#364254}.progress{margin-top:18px;padding:15px;border:1px solid var(--line);border-radius:12px;background:#fcfdff}.progress-head{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12px;font-weight:700}.elapsed{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}.track{height:7px;border-radius:99px;background:#e9edf2;overflow:hidden;margin:11px 0 8px}.bar{height:100%;width:0;background:linear-gradient(90deg,#d7952c,#f1c26f);border-radius:99px;transition:width .25s}.bar.indeterminate{width:38%;animation:travel 1.3s ease-in-out infinite alternate}.progress-detail{font-size:11px;color:var(--muted);line-height:1.5;min-height:17px}.steps{display:flex;gap:7px;margin-top:13px}.step{flex:1;display:flex;gap:6px;align-items:center;color:#9aa5b3;font-size:10px}.dot{width:8px;height:8px;border-radius:50%;background:#d7dee7;flex:none}.step.active{color:#8a5d19}.step.active .dot{background:var(--gold);box-shadow:0 0 0 3px #f8ecd6}.step.done{color:var(--green)}.step.done .dot{background:var(--green)}.status-error{font-size:12px;line-height:1.55;color:#b42318;background:#fff2f1;border:1px solid #ffd1cc;border-radius:9px;padding:10px;margin-top:11px}.right{min-height:620px;display:flex;flex-direction:column;overflow:hidden}.result-head{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.tabs{display:flex;gap:5px}.tab{border:0;background:transparent;border-radius:8px;padding:8px 11px;color:#697586;font-size:12px;font-weight:650;cursor:pointer}.tab.active{background:#f1f4f7;color:#17202d}.download-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.small-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;color:#465367;font-size:11px;font-weight:650;cursor:pointer}.small-btn:hover:not(:disabled){border-color:#c4ced9;background:#f9fafb}.small-btn:disabled{opacity:.4;cursor:not-allowed}.result-body{padding:18px;flex:1;min-height:540px}.empty{height:500px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#8a96a5}.empty-icon{font-size:34px;margin-bottom:12px;opacity:.7}.empty strong{font-size:14px;color:#596679}.empty span{font-size:12px;margin-top:6px}.result-pane[hidden]{display:none}.result-text{width:100%;height:500px;resize:vertical;border:1px solid var(--line);border-radius:11px;padding:16px;background:#fbfcfd;color:#263345;font:12px/1.65 "Cascadia Code",Consolas,monospace;white-space:pre;overflow:auto}.meta{color:var(--muted);font-size:11px}.hidden{display:none!important}@keyframes travel{from{transform:translateX(0)}to{transform:translateX(165%)}}@media(max-width:800px){.grid{grid-template-columns:1fr}.right{min-height:460px}.result-body{min-height:400px}.result-text,.empty{height:380px}.top{padding:0 18px}.top-tag{font-size:10px}}@media(max-width:480px){main{padding:24px 13px}.top{height:60px}.intro h1{font-size:22px}.result-head{align-items:flex-start;flex-direction:column}.download-actions{justify-content:flex-start}.step{font-size:9px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><span class="logo">O</span><span>OXR 文档解析工作台</span></div><span class="top-tag">本地页面 · 本机版面分析 · 内网 OXR 模型</span></header>
<main>
<section class="intro"><h1>上传文件，开始解析</h1><p>支持 PDF 和常见图片。解析完成后可预览并导出 Markdown、JSON 或 Word。</p></section>
<div class="grid">
<section class="card left">
<h2 class="card-title">选择待解析文件</h2>
<input id="file-input" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.bmp,.tif,.tiff" class="hidden">
<div id="drop" class="drop" role="button" tabindex="0"><div class="upload-icon">↑</div><strong>点击选择文件，或拖拽到此处</strong><span>PDF、PNG、JPG、WEBP、TIFF，最大 100 MiB</span></div>
<div id="file-info" class="file-info hidden"><div class="file-icon" id="file-ext">PDF</div><div class="file-text"><div class="file-name" id="file-name"></div><div class="file-size" id="file-size"></div></div><button id="remove-file" class="remove" type="button" aria-label="移除文件">×</button></div>
<div class="actions"><button id="start" class="btn primary" type="button" disabled>开始解析</button><button id="clear" class="btn plain" type="button">清空</button></div>
<div class="progress" aria-live="polite">
<div class="progress-head"><span id="phase">等待选择文件</span><span class="elapsed" id="elapsed">00:00</span></div>
<div class="track"><div id="bar" class="bar"></div></div>
<div class="progress-detail" id="detail">选择文件后开始解析。上传期间显示真实上传百分比，识别期间显示版面页数和区块进度。</div>
<div class="steps"><div id="step-upload" class="step"><i class="dot"></i><span>上传</span></div><div id="step-parse" class="step"><i class="dot"></i><span>版面与识别</span></div><div id="step-done" class="step"><i class="dot"></i><span>导出结果</span></div></div>
<div id="error" class="status-error hidden" role="alert"></div>
</div>
</section>
<section class="card right">
<div class="result-head"><div class="tabs"><button id="tab-md" class="tab active" type="button">Markdown</button><button id="tab-json" class="tab" type="button">JSON</button></div>
<div class="download-actions"><button id="copy" class="small-btn" type="button" disabled>复制</button><button id="download-md" class="small-btn" type="button" disabled>下载 .md</button><button id="download-json" class="small-btn" type="button" disabled>下载 .json</button><button id="download-docx" class="small-btn" type="button" disabled>下载 Word</button></div></div>
<div class="result-body"><div id="empty" class="empty"><div class="empty-icon">▤</div><strong>识别结果会显示在这里</strong><span>上传文档并开始解析后，结果将在此展示</span></div>
<div id="pane-md" class="result-pane" hidden><textarea id="markdown" class="result-text" readonly spellcheck="false" aria-label="Markdown 识别结果"></textarea></div>
<div id="pane-json" class="result-pane" hidden><textarea id="json" class="result-text" readonly spellcheck="false" aria-label="JSON 识别结果"></textarea></div>
</div>
<div class="result-head"><span id="result-meta" class="meta">尚无识别结果</span></div>
</section>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
const input=$("file-input"),drop=$("drop"),start=$("start"),clear=$("clear"),bar=$("bar"),phase=$("phase"),detail=$("detail"),elapsed=$("elapsed"),errorBox=$("error");
const accepted=["pdf","png","jpg","jpeg","webp","bmp","tif","tiff"],maxBytes=100*1024*1024;
let selected=null,markdown="",jsonText="",resultFileName="document",timer=null,startedAt=0,busy=false,activeTab="md";
function formatSize(bytes){return bytes<1024*1024?(bytes/1024).toFixed(0)+" KB":(bytes/1024/1024).toFixed(2)+" MB";}
function safeStem(name){return (name||"document").replace(/\.[^.]+$/,"").replace(/[\/:*?"<>|]/g,"_").slice(0,120)||"document";}
function setStep(id,state){$(id).className="step"+(state?" "+state:"");}
function setBar(percent,indeterminate){bar.classList.toggle("indeterminate",Boolean(indeterminate));if(!indeterminate)bar.style.width=Math.max(0,Math.min(100,percent))+"%";}
function showError(message){errorBox.textContent=message;errorBox.classList.remove("hidden");}
function clearError(){errorBox.textContent="";errorBox.classList.add("hidden");}
function updateElapsed(){if(!startedAt)return;const sec=Math.floor((Date.now()-startedAt)/1000);elapsed.textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");}
function resetProgress(){startedAt=0;elapsed.textContent="00:00";phase.textContent="等待选择文件";detail.textContent="选择文件后开始解析。上传期间显示真实上传百分比，识别期间显示版面页数和区块进度。";setBar(0,false);setStep("step-upload","");setStep("step-parse","");setStep("step-done","");}
function renderFile(file){if(!file||busy)return;clearError();const ext=(file.name.split(".").pop()||"").toLowerCase();if(!accepted.includes(ext)||file.size>maxBytes||!file.size){selected=null;input.value="";$("file-info").classList.add("hidden");start.disabled=true;resetResult();resetProgress();showError(!accepted.includes(ext)?"文件格式不支持，请选择 PDF 或常见图片。":file.size>maxBytes?"文件超过 100 MiB，请缩小后再上传。":"文件为空，请重新选择。");return;}selected=file;$("file-info").classList.remove("hidden");$("file-ext").textContent=ext.toUpperCase().slice(0,4);$("file-name").textContent=file.name;$("file-size").textContent=formatSize(file.size);start.disabled=busy;clearError();resetResult();resetProgress();start.disabled=false;}
function resetResult(){markdown="";jsonText="";$("markdown").value="";$("json").value="";$("empty").classList.remove("hidden");$("pane-md").hidden=true;$("pane-json").hidden=true;$("result-meta").textContent="尚无识别结果";["copy","download-md","download-json","download-docx"].forEach(id=>$(id).disabled=true);}
function setTab(tab){activeTab=tab;$("tab-md").classList.toggle("active",tab==="md");$("tab-json").classList.toggle("active",tab==="json");$("empty").classList.add("hidden");$("pane-md").hidden=tab!=="md";$("pane-json").hidden=tab!=="json";}
function triggerDownload(blob,name){const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function readBody(response){let body;try{body=await response.json();}catch{throw new Error("服务器返回了无效响应。");}if(!response.ok||body.code!==0)throw new Error(body.message||body.detail||"请求失败。");return body.data;}
function uploadTask(file){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest(),form=new FormData();form.append("file",file);form.append("api_key","dummy");form.append("output_formats","markdown");form.append("output_formats","json");xhr.open("POST","/v1/parse/async");xhr.timeout=180000;xhr.upload.onprogress=e=>{if(e.lengthComputable){const pct=Math.round(e.loaded/e.total*100);phase.textContent="正在上传 "+pct+"%";detail.textContent=formatSize(e.loaded)+" / "+formatSize(e.total);setBar(pct,false);setStep("step-upload","active");}};xhr.onerror=()=>reject(new Error("连接本地解析服务失败。"));xhr.ontimeout=()=>reject(new Error("上传超时，请重试。"));xhr.onload=()=>{let body;try{body=JSON.parse(xhr.responseText);}catch{return reject(new Error("服务器返回了无效响应。"));}if(xhr.status<200||xhr.status>=300||body.code!==0)return reject(new Error(body.message||body.detail||"提交解析任务失败。"));resolve(body.data);};xhr.send(form);});}
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function renderTaskProgress(progress){if(!progress)return;const stage=progress.stage||"processing";phase.textContent=progress.label||"正在解析";detail.textContent=progress.detail||"正在处理文档…";const percent=Number(progress.percent);if(Number.isFinite(percent))setBar(percent,false);if(stage==="queued"){setStep("step-upload","done");setStep("step-parse","active");return;}if(stage==="decode"){setStep("step-upload","done");setStep("step-parse","active");return;}setStep("step-upload","done");if(stage==="assembly"||stage==="complete"){setStep("step-parse","done");setStep("step-done",stage==="complete"?"done":"active");}else{setStep("step-parse","active");setStep("step-done","");}}
async function pollTask(taskId){let failures=0;while(true){await wait(1200);const form=new FormData();form.append("task_id",taskId);form.append("api_key","dummy");try{const response=await fetch("/v1/parse/async_check",{method:"POST",body:form});const data=await readBody(response);failures=0;renderTaskProgress(data.progress);if(data.status==="success")return data;if(data.status==="failed")throw new Error(data.error||"解析失败。");}catch(e){if(e.message&&e.message!=="Failed to fetch"&&!(e instanceof TypeError))throw e;failures++;if(failures>=5)throw new Error("连续多次无法查询解析进度，请检查服务状态。");}}}
async function run(){if(!selected||busy)return;busy=true;start.disabled=true;clear.disabled=true;clearError();resetResult();startedAt=Date.now();timer=setInterval(updateElapsed,500);phase.textContent="准备上传";detail.textContent="正在提交文件…";setStep("step-upload","active");setBar(0,false);try{const task=await uploadTask(selected);setStep("step-upload","done");setStep("step-parse","active");phase.textContent=task.status==="queuing"?"任务排队中":"开始解析";detail.textContent="任务已提交，正在等待解析状态…";setBar(0,true);const data=await pollTask(task.task_id);const payload=data.result||{},outputs=payload.outputs||{};markdown=typeof outputs.markdown==="string"?outputs.markdown:"";const rawJson=outputs.json;jsonText=typeof rawJson==="string"?rawJson:JSON.stringify(rawJson??payload,null,2);$("markdown").value=markdown||"（没有 Markdown 输出）";$("json").value=jsonText;resultFileName=payload.file_name||selected.name;setTab("md");$("empty").classList.add("hidden");$("download-md").disabled=!markdown;$("download-json").disabled=!jsonText;$("download-docx").disabled=!markdown;$("copy").disabled=!markdown;const pages=(data.metadata&&data.metadata.total_pages)||"";$("result-meta").textContent="识别完成"+(pages?" · "+pages+" 页":"")+" · "+elapsed.textContent;phase.textContent="解析完成";detail.textContent="Markdown、JSON 和 Word 导出已就绪。";setStep("step-parse","done");setStep("step-done","done");setBar(100,false);}catch(e){phase.textContent="解析未完成";detail.textContent="请根据错误信息检查文件或服务连接。";bar.classList.remove("indeterminate");showError(e.message||"解析失败，请稍后重试。");}finally{busy=false;start.disabled=!selected;clear.disabled=false;if(timer){clearInterval(timer);timer=null;}}}
drop.addEventListener("click",()=>input.click());drop.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();input.click();}});input.addEventListener("change",()=>renderFile(input.files[0]));for(const ev of ["dragenter","dragover"])drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("drag");});for(const ev of ["dragleave","drop"])drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("drag");});drop.addEventListener("drop",e=>{e.preventDefault();renderFile(e.dataTransfer.files[0]);});$("remove-file").addEventListener("click",()=>{if(busy)return;selected=null;input.value="";$("file-info").classList.add("hidden");start.disabled=true;resetProgress();resetResult();clearError();});start.addEventListener("click",run);clear.addEventListener("click",()=>{if(busy)return;selected=null;input.value="";$("file-info").classList.add("hidden");resetProgress();resetResult();clearError();start.disabled=true;});$("tab-md").addEventListener("click",()=>setTab("md"));$("tab-json").addEventListener("click",()=>setTab("json"));$("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(activeTab==="json"?jsonText:markdown);detail.textContent="已复制到剪贴板。";}catch{showError("浏览器不允许访问剪贴板，请手动复制。");}});$("download-md").addEventListener("click",()=>triggerDownload(new Blob([markdown],{type:"text/markdown;charset=utf-8"}),safeStem(resultFileName)+"-OXR.md"));$("download-json").addEventListener("click",()=>triggerDownload(new Blob([jsonText],{type:"application/json;charset=utf-8"}),safeStem(resultFileName)+"-OXR.json"));$("download-docx").addEventListener("click",async()=>{const button=$("download-docx");button.disabled=true;button.textContent="生成中…";try{const response=await fetch("/v1/export/docx",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({markdown,file_name:resultFileName})});if(!response.ok){let body={};try{body=await response.json();}catch{}throw new Error(body.message||"Word 导出失败。");}triggerDownload(await response.blob(),safeStem(resultFileName)+"-OXR.docx");detail.textContent="Word 文档已生成并下载。";}catch(e){showError(e.message||"Word 导出失败。");}finally{button.disabled=!markdown;button.textContent="下载 Word";}});
</script>
</body>
</html>
